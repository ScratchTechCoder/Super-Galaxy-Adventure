<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Galaxy Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27, #1a1a3e);
            border: none;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: all 0.3s ease;
        }

        #gameContainer.windowed {
            width: 800px;
            height: 600px;
            border: 3px solid #00ff00;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 10px #00ff00;
            pointer-events: none;
        }

        #lives {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 10px #00ff00;
            pointer-events: none;
        }

        #fullscreenBtn {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff00;
            color: #000;
            border: 2px solid #00ff00;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            z-index: 15;
            font-size: 14px;
            transition: all 0.3s;
        }

        #fullscreenBtn:hover {
            background: #00cc00;
            box-shadow: 0 0 10px #00ff00;
        }

        #fullscreenBtn:active {
            transform: translateX(-50%) scale(0.95);
        }

        #gameContainer.windowed #fullscreenBtn {
            font-size: 12px;
            padding: 6px 12px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff0000;
            padding: 40px;
            text-align: center;
            z-index: 100;
            display: none;
            border-radius: 10px;
        }

        #gameContainer.windowed #gameOver {
            padding: 40px;
        }

        #gameOver h1 {
            color: #ff0000;
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
        }

        #gameContainer.windowed #gameOver h1 {
            font-size: 48px;
        }

        #gameOver p {
            color: #00ff00;
            font-size: 32px;
            margin: 10px 0;
        }

        #gameContainer.windowed #gameOver p {
            font-size: 24px;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 16px 40px;
            font-size: 24px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #gameContainer.windowed #gameOver button {
            padding: 12px 30px;
            font-size: 18px;
        }

        #gameOver button:hover {
            background: #00cc00;
            box-shadow: 0 0 10px #00ff00;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 18px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #gameContainer.windowed .controls {
            font-size: 14px;
            bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <button id="fullscreenBtn">⛶ Window Mode</button>
        <div id="score">Score: 0</div>
        <div id="lives">Lives: 3</div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p id="finalScore">Final Score: 0</p>
            <button onclick="location.reload()">Play Again</button>
        </div>
        <div class="controls">
            <p>← → Arrow Keys to Move | SPACE to Shoot | F to Toggle Fullscreen</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // Start in fullscreen by default
        let isFullscreen = true;
        
        // Set canvas size to fullscreen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Pre-calculate background
        const backgroundCanvas = document.createElement('canvas');
        backgroundCanvas.width = canvas.width;
        backgroundCanvas.height = canvas.height;
        const bgCtx = backgroundCanvas.getContext('2d');
        
        function drawBackground() {
            const gradient = bgCtx.createLinearGradient(0, 0, 0, backgroundCanvas.height);
            gradient.addColorStop(0, '#0a0e27');
            gradient.addColorStop(1, '#1a1a3e');
            bgCtx.fillStyle = gradient;
            bgCtx.fillRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);
            
            // Draw stars
            bgCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 100; i++) {
                const x = (i * 137) % backgroundCanvas.width;
                const y = (i * 71) % backgroundCanvas.height;
                bgCtx.fillRect(x, y, 1, 1);
            }
        }
        
        drawBackground();

        // Game variables
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let level = 1;
        let frameCount = 0;
        let lastScoreUpdate = -1;
        let lastLivesUpdate = -1;

        // Player
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 50,
            width: 40,
            height: 40,
            speed: 6,
            dx: 0,
            update() {
                this.x += this.dx;
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
            },
            draw(ctx) {
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
            }
        };

        // Pre-allocated arrays for bullets (fixed pool size)
        const bulletPool = new Array(100);
        const enemyBulletPool = new Array(200);
        const enemyPool = new Array(50);
        
        let bulletPoolIndex = 0;
        let enemyBulletPoolIndex = 0;
        let enemyPoolIndex = 0;

        const createBullet = (x, y) => {
            if (bulletPoolIndex < bulletPool.length) {
                const bullet = bulletPool[bulletPoolIndex++];
                if (!bullet) {
                    const b = { x, y, width: 5, height: 15, speed: 8 };
                    bulletPool[bulletPoolIndex - 1] = b;
                    return b;
                }
                bullet.x = x;
                bullet.y = y;
                return bullet;
            }
            return { x, y, width: 5, height: 15, speed: 8 };
        };

        const createEnemyBullet = (x, y) => {
            if (enemyBulletPoolIndex < enemyBulletPool.length) {
                const bullet = enemyBulletPool[enemyBulletPoolIndex++];
                if (!bullet) {
                    const b = { x, y, width: 5, height: 12, speed: 4.5 };
                    enemyBulletPool[enemyBulletPoolIndex - 1] = b;
                    return b;
                }
                bullet.x = x;
                bullet.y = y;
                return bullet;
            }
            return { x, y, width: 5, height: 12, speed: 4.5 };
        };

        const createEnemy = (x, y, type) => {
            if (enemyPoolIndex < enemyPool.length) {
                const enemy = enemyPool[enemyPoolIndex++];
                if (!enemy) {
                    const e = {
                        x, y,
                        width: 35,
                        height: 35,
                        speed: 2 + level * 0.4,
                        type: type,
                        shootTimer: Math.random() * 100,
                        dx: 1
                    };
                    enemyPool[enemyPoolIndex - 1] = e;
                    return e;
                }
                enemy.x = x;
                enemy.y = y;
                enemy.type = type;
                enemy.shootTimer = Math.random() * 100;
                enemy.speed = 2 + level * 0.4;
                enemy.dx = 1;
                return enemy;
            }
            return {
                x, y,
                width: 35,
                height: 35,
                speed: 2 + level * 0.4,
                type: type,
                shootTimer: Math.random() * 100,
                dx: 1
            };
        };

        let bulletCount = 0;
        let enemyBulletCount = 0;
        let enemies = [];

        // Collision detection (optimized)
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Toggle fullscreen/windowed
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            
            if (isFullscreen) {
                gameContainer.classList.remove('windowed');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                fullscreenBtn.textContent = '⛶ Window Mode';
                
                // Redraw background for new size
                backgroundCanvas.width = canvas.width;
                backgroundCanvas.height = canvas.height;
                drawBackground();
            } else {
                gameContainer.classList.add('windowed');
                canvas.width = 800;
                canvas.height = 600;
                fullscreenBtn.textContent = '⛶ Fullscreen';
                
                // Redraw background for new size
                backgroundCanvas.width = 800;
                backgroundCanvas.height = 600;
                drawBackground();
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Handle window resize in fullscreen
        window.addEventListener('resize', () => {
            if (isFullscreen) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                backgroundCanvas.width = canvas.width;
                backgroundCanvas.height = canvas.height;
                drawBackground();
            }
        });

        // Keyboard input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                shoot();
            }
            if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullscreen();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function shoot() {
            bulletPool[bulletCount] = createBullet(player.x + player.width / 2 - 2.5, player.y);
            bulletCount++;
            if (bulletCount >= bulletPool.length) bulletCount = bulletPool.length - 1;
        }

        // Spawn enemies
        function spawnEnemies() {
            enemies = [];
            const rows = Math.min(2 + level, 5);
            const cols = 6;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const type = Math.random() > 0.7 ? 'strong' : 'basic';
                    enemies.push(createEnemy(50 + j * 100, 30 + i * 70, type));
                }
            }
        }

        // Update game state
        function update() {
            if (gameOver) return;

            frameCount++;

            // Player movement
            player.dx = 0;
            if (keys['ArrowLeft']) player.dx = -player.speed;
            if (keys['ArrowRight']) player.dx = player.speed;
            player.update();

            // Update bullets (fixed array iteration)
            for (let i = 0; i < bulletCount; i++) {
                const bullet = bulletPool[i];
                bullet.y -= bullet.speed;
                
                if (bullet.y < 0) {
                    // Move to back and decrement
                    bulletPool[i] = bulletPool[bulletCount - 1];
                    bulletPool[bulletCount - 1] = bullet;
                    bulletCount--;
                    i--;
                    continue;
                }

                // Check collision with enemies
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (checkCollision(bullet, enemies[j])) {
                        score += 100;
                        // Move to back and decrement
                        bulletPool[i] = bulletPool[bulletCount - 1];
                        bulletPool[bulletCount - 1] = bullet;
                        bulletCount--;
                        
                        enemies[j] = enemies[enemies.length - 1];
                        enemies.pop();
                        hit = true;
                        break;
                    }
                }
                if (hit) i--;
            }

            // Update enemies
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                enemy.x += enemy.speed * enemy.dx;
                
                if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
                    enemy.dx *= -1;
                    enemy.y += 30;
                }
                
                enemy.shootTimer++;
                
                // Enemy shoots (reduced frequency)
                if (enemy.shootTimer > 80 + Math.random() * 50) {
                    enemyBulletPool[enemyBulletCount] = createEnemyBullet(
                        enemy.x + enemy.width / 2,
                        enemy.y + enemy.height
                    );
                    enemyBulletCount++;
                    if (enemyBulletCount >= enemyBulletPool.length) enemyBulletCount = enemyBulletPool.length - 1;
                    enemy.shootTimer = 0;
                }
            }

            // Update enemy bullets (fixed array iteration)
            for (let i = 0; i < enemyBulletCount; i++) {
                const bullet = enemyBulletPool[i];
                bullet.y += bullet.speed;
                
                if (bullet.y > canvas.height) {
                    // Move to back and decrement
                    enemyBulletPool[i] = enemyBulletPool[enemyBulletCount - 1];
                    enemyBulletPool[enemyBulletCount - 1] = bullet;
                    enemyBulletCount--;
                    i--;
                    continue;
                }

                // Check collision with player
                if (checkCollision(bullet, player)) {
                    lives--;
                    // Move to back and decrement
                    enemyBulletPool[i] = enemyBulletPool[enemyBulletCount - 1];
                    enemyBulletPool[enemyBulletCount - 1] = bullet;
                    enemyBulletCount--;
                    i--;
                    
                    if (lives <= 0) {
                        gameOver = true;
                        document.getElementById('finalScore').textContent = `Final Score: ${score}`;
                        document.getElementById('gameOver').style.display = 'block';
                    }
                }
            }

            // Check if all enemies destroyed
            if (enemies.length === 0 && level < 10) {
                level++;
                spawnEnemies();
            }

            // Update UI only when changed
            if (score !== lastScoreUpdate) {
                scoreElement.textContent = `Score: ${score}`;
                lastScoreUpdate = score;
            }
            if (lives !== lastLivesUpdate) {
                livesElement.textContent = `Lives: ${lives}`;
                lastLivesUpdate = lives;
            }
        }

        // Draw game
        function draw() {
            // Draw background
            ctx.drawImage(backgroundCanvas, 0, 0);

            // Draw player
            player.draw(ctx);

            // Draw bullets (fixed array)
            ctx.fillStyle = '#ffff00';
            for (let i = 0; i < bulletCount; i++) {
                const b = bulletPool[i];
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }

            // Draw enemies
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                ctx.fillStyle = enemy.type === 'basic' ? '#ff00ff' : '#ff6600';
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.width / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(enemy.x + 8, enemy.y + 8, 4, 4);
                ctx.fillRect(enemy.x + 23, enemy.y + 8, 4, 4);
            }

            // Draw enemy bullets (fixed array)
            ctx.fillStyle = '#ff6600';
            for (let i = 0; i < enemyBulletCount; i++) {
                const b = enemyBulletPool[i];
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }

            // Draw level (batch update)
            if (frameCount % 10 === 0) {
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Level: ${level}`, canvas.width / 2, 30);
            }
        }

        // Optimized game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        spawnEnemies();
        gameLoop();
    </script>
</body>
</html>
